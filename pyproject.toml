[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conduit-protocol"
version = "0.1.0"
description = "Language-neutral Conduit message-envelope protocol: schema, transport bindings, and cross-client conformance fixtures."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.hatch.build.targets.wheel]
packages = ["conduit_protocol"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "conduit_protocol/schemas"
"transports" = "conduit_protocol/transports"
"conformance" = "conduit_protocol/conformance"
